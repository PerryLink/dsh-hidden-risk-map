# 重大隐患条款映射 规则库
#
# 规则数据与代码分离：替换本文件即可切换规则集版本，无需改动 TypeScript。
#
# 条款引用纪律（由 shared/ruleset.ts 强制校验）：
#   - 每条规则必须写全 document / number / clause / excerpt / kind / source，
#     且 excerpt 必须是逐字摘录，不得改写。
#   - kind: direct                       条款直接规定了所检查的要求
#   - kind: derived-from-principle       条款未直接规定，仅能由原则性条款推论（severity 最多 warn）
#   - kind: institutional-configuration 阈值出自本机构配置（severity 最多 info）
#
# ⚠️ 版本提示：《工贸企业重大事故隐患判定标准》现行为**应急管理部令第10号**，
#    2023-03-20 部务会议审议通过，**2023-04-14 公布，2023-05-15 施行**；
#    其第十五条明文废止了安监总管四〔2017〕129号《工贸行业重大生产安全事故隐患判定标准（2017版）》。
#    **一律按第10号令引用，不得再引 2017 版条号。**
#
# ⚠️ 本插件的定位（别改）：它做的是**台账条目 → 判定条款的候选映射**，不是判定结论。
#    判定"是否构成重大事故隐患"要结合现场核查与专业判断；本插件只把台账文字与条款文字
#    的对应关系摆出来，供人工复核。因此 HR-001~HR-004 全部为提示级。
#
# 适用范围提示（第二条原文）：本标准适用于冶金、有色、建材、机械、轻工、纺织、烟草、商贸等
# 工贸企业；工贸企业内涉及危险化学品、消防（火灾）、燃气、特种设备等方面的重大事故隐患判定
# **另有规定的，适用其规定**。因此本插件对危化品/消防/燃气/特种设备类条目不作映射，
# 而在 skipped 中说明应改查相应规定。

plugin: dsh-hidden-risk-map
version: "2026.1"

rules:
  - id: HR-001
    title: 台账条目应能定位到判定标准的具体条款
    severity: warn
    basis:
      document: 《工贸企业重大事故隐患判定标准》
      number: 应急管理部令第10号
      clause: 第一条
      excerpt: 为了准确判定、及时消除工贸企业重大事故隐患（以下简称重大事故隐患），根据《中华人民共和国安全生产法》等法律、行政法规，制定本标准。
      kind: derived-from-principle
      source: https://www.gov.cn/gongbao/2023/issue_10566/202307/content_6890788.html
    params:
      tagField: 隐患类别
      clauses:
        - article: 第三条
          industry: 通用
          excerpt: 工贸企业有下列情形之一的，应当判定为重大事故隐患
          keywords:
            - 承包单位
            - 承租单位
            - 统一协调
            - 定期进行安全检查
            - 特种作业人员
            - 专门的安全作业培训
            - 考核合格
        - article: 第四条
          industry: 冶金
          excerpt: 冶金企业有下列情形之一的，应当判定为重大事故隐患
          keywords:
            - 铁水
            - 钢水
            - 液渣
            - 吊运跨
            - 熔融金属
            - 炉下渣坑
            - 事故坑
            - 连铸
            - 事故钢水罐
            - 漏钢
            - 转炉
            - 电弧炉
            - AOD
            - LF炉
            - RH炉
            - VOD
            - 高炉
            - 炉顶放散阀
            - 煤气柜
            - 一氧化碳浓度监测
            - 水封式排水器
        - article: 第五条
          industry: 有色
          excerpt: 有色企业有下列情形之一的，应当判定为重大事故隐患
          keywords:
            - 熔融金属吊运
            - 熔融金属铸造
            - 铝加工
            - 深井铸造
            - 结晶器
            - 浇铸炉
            - 模盘
            - 分配流槽
            - 钢丝卷扬
            - 砷化氢
            - 应急水源
        - article: 第六条
          industry: 建材
          excerpt: 建材企业有下列情形之一的，应当判定为重大事故隐患
          keywords:
            - 煤磨
            - 袋式收尘器
            - 煤粉仓
            - 筒型储库
            - 清库作业
            - 电石渣
            - 焙烧窑
            - 预热器旋风筒
            - 分解炉
            - 篦冷机
            - 制氢站
            - 氮氢保护气体
            - 电熔制品电炉
            - 玻璃窑炉
            - 玻璃锡槽
        - article: 第七条
          industry: 机械
          excerpt: 机械企业有下列情形之一的，应当判定为重大事故隐患
          keywords:
            - 铸造用熔炼炉
            - 精炼炉
            - 保温炉
            - 浇注跨
            - 造型地坑
            - 浇注作业坑
            - 压铸机
            - 熔融金属转运通道
        - article: 第八条
          industry: 轻工
          excerpt: 轻工企业有下列情形之一的，应当判定为重大事故隐患
          keywords:
            - 轻工
            - 造纸
            - 食品加工
            - 涉氨
            - 有限空间
            - 木粉尘
        - article: 第九条
          industry: 纺织
          excerpt: 纺织企业有下列情形之一的，应当判定为重大事故隐患
          keywords:
            - 纺织
            - 棉尘
            - 麻尘
            - 毛纺
            - 针织
        - article: 第十条
          industry: 烟草
          excerpt: 烟草企业有下列情形之一的，应当判定为重大事故隐患
          keywords:
            - 烟草
            - 打叶复烤
            - 卷烟
        - article: 第十一条
          industry: 粉尘涉爆
          excerpt: 存在粉尘爆炸危险的工贸企业有下列情形之一的，应当判定为重大事故隐患
          keywords:
            - 粉尘涉爆
            - 除尘系统
            - 粉尘爆炸
            - 铝镁粉尘
            - 木粉尘
            - 静电
        - article: 第十二条
          industry: 使用液氨制冷
          excerpt: 使用液氨制冷的工贸企业有下列情形之一的，应当判定为重大事故隐患
          keywords:
            - 液氨
            - 氨制冷
            - 冷库
            - 氨气泄漏
        - article: 第十三条
          industry: 有限空间作业
          excerpt: 存在硫化氢、一氧化碳等中毒风险的有限空间作业的工贸企业有下列情形之一的，应当判定为重大事故隐患
          keywords:
            - 有限空间
            - 硫化氢
            - 中毒风险
            - 污水池
            - 发酵池
            - 作业审批
    note: >-
      本条把"台账里写了、但按本机构配置的关键词找不到任何对应条款"的条目显式列出来。
      它不判断条目是否属于重大隐患，只指出"无法定位条款"这一事实，避免漏检被读成"没问题"。
      clauses 的关键词为**人工归纳的检索词**（不是标准原文），其作用是把台账文字指向候选条款；
      条款号与 industry 标注来自标准正文。使用方应把本企业习惯用词补进来。
      关键词表随判定标准版本变化，故本表放在规则库里而非代码里。

  - id: HR-002
    title: 命中条款的条目应核对是否为本企业所属行业条款
    severity: warn
    basis:
      document: 《工贸企业重大事故隐患判定标准》
      number: 应急管理部令第10号
      clause: 第二条
      excerpt: 本标准适用于判定冶金、有色、建材、机械、轻工、纺织、烟草、商贸等工贸企业重大事故隐患。工贸企业内涉及危险化学品、消防（火灾）、燃气、特种设备等方面的重大事故隐患判定另有规定的，适用其规定。
      kind: direct
      source: https://www.gov.cn/gongbao/2023/issue_10566/202307/content_6890788.html
    params:
      industry: ''
      industryField: 所属行业
      otherRegimes:
        - 危险化学品
        - 消防
        - 火灾
        - 燃气
        - 特种设备
    note: >-
      industry 留空表示未配置：本插件不假定使用方属于哪个行业。
      配置后，本条会报出"命中条款属于其他行业"的情形，提示改用本行业条款。
      涉及危化品、消防、燃气、特种设备的条目，按判定标准第二条应适用其他规定，本条会逐条提示。
      注意：本插件**没有**把各行业下的具体条款号硬编码进代码，
      条款与行业的对应关系来自本规则库的 clauses 表，可直接替换为当年有效版本。

  - id: HR-003
    title: 命中判定条款的条目应留下整改闭环信息
    severity: warn
    basis:
      document: 《工贸企业重大事故隐患判定标准》
      number: 应急管理部令第10号
      clause: 第一条
      excerpt: 为了准确判定、及时消除工贸企业重大事故隐患（以下简称重大事故隐患），根据《中华人民共和国安全生产法》等法律、行政法规，制定本标准。
      kind: derived-from-principle
      source: https://www.gov.cn/gongbao/2023/issue_10566/202307/content_6890788.html
    params:
      requiredFields: []
    note: >-
      ⚠️ 待补充权威依据：本条只引了标准第一条"及时消除"的目的表述，把它作为"命中条目应有整改
      闭环信息"的原则性推论。**直接依据应来自隐患整改闭环管理制度（《安全生产法》与地方双重预防
      机制文件），本次未逐字核实到具体条款**，故降为 warn 且 requiredFields 留空即不执行。
      要启用请配置本机构要求的字段名，例如 requiredFields: [整改措施, 整改责任人, 整改完成时间]。
      注意：本插件**不判断整改是否合格、是否销号**，只核对字段是否存在。

  - id: HR-004
    title: 同一条款被多条台账命中的情况应人工复核
    severity: info
    basis:
      document: 《工贸企业重大事故隐患判定标准》
      number: 应急管理部令第10号
      clause: 第三条
      excerpt: 工贸企业有下列情形之一的，应当判定为重大事故隐患：
      kind: derived-from-principle
      source: https://www.gov.cn/gongbao/2023/issue_10566/202307/content_6890788.html
    params:
      maxHitsPerClause: 0
    note: >-
      maxHitsPerClause 留空（0）表示不执行本检查。配置为正整数后，本条会报出"同一条款被超过
      该数量的台账条目命中"的情形，用于发现重复登记或系统性缺陷；是否属于重复登记需人工判断。

disabled: []
